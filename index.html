<style>

h1{font-size:34px;line-height:1.05}

.chip.ind,.chip.k-tpl{border-style:dashed}
.chip.k-free{border-left-color:var(--ac)}
.chip.s-completed{border-left-color:var(--ok)}.chip.s-partial{border-left-color:var(--wn)}
.chip.s-cancelled,.chip.a-cancel,.chip.a-hold{text-decoration:line-through;opacity:.6}
.chip.s-completed::before{content:"✓ "}
.row,.rw{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row{width:100%;background:none;border:0;border-bottom:1px solid var(--ln);padding:7px 2px;text-align:left;cursor:pointer}
.rw{border-bottom:1px solid var(--ln)}.rw .row{border:0;flex:1}
.rt{flex:1;min-width:140px}
.st{font-size:12px;font-weight:600}.s-completed{color:var(--ok)}.s-partial,.s-substituted{color:var(--wn)}.s-cancelled{color:var(--mu)}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi .num{font-size:38px;font-weight:700;line-height:1}
dialog{border:1px solid var(--ink);border-radius:8px;background:var(--sf);color:var(--ink);padding:18px;width:min(680px,94vw);max-height:92vh}
dialog::backdrop{background:rgba(5,12,22,.6)}

tr[data-open]{cursor:pointer}
svg text{fill:var(--mu);font-size:11px}svg .ln{stroke:var(--ac);fill:none;stroke-width:2}svg .pt{fill:var(--ac)}svg .ax{stroke:var(--ln)}
textarea.big{width:100%;min-height:140px;font:12px monospace;background:var(--bg);border:1px solid var(--ln);color:var(--ink)}

@media(prefers-reduced-motion:no-preference){.count .num{animation:in .6s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}}}
</style>

function drow(s){return `<div class="rw"><button class="row" data-open="${esc(s.id)}"><span class="bib">${esc(s.id)}</span><span class="rt">${esc(s.title)}</span><span class="mu">${s.date?fmt(s.date):'à planifier'}</span><span class="st s-${stat(s)}">${SL[stat(s)]}${st.adapt[s.id]?' ⚑':''}</span></button></div>`}
function rProg(){let h=`<div class="card"><h2>Dates à confirmer</h2><div class="grid2">`;
 ev.forEach(e=>{const dt=e.date||st.eventDates[e.event_id];h+=`<div><b>${esc(e.name)}</b> <span class="badge ${e.date?'def':'ind'}">${e.date?'Date confirmée':dt?'Date saisie par toi':'À confirmer'}</span><br><span class="sm mu">${e.date?fmt(e.date,{day:'numeric',month:'long',year:'numeric'}):`Fenêtre ${fmt(e.date_window.start,{day:'numeric',month:'short'})} – ${fmt(e.date_window.end,{day:'numeric',month:'short',year:'numeric'})}`}${e.goal_time_min_range?` · objectif ${e.goal_time_min_range.join('–')} min (${e.goal_pace_min_per_km_range.join('–')}/km, cible théorique)`:''}</span>
  ${e.date?'':`<div class="rw" style="border:0"><input type="date" data-ev="${e.event_id}" value="${dt||''}" min="${e.date_window.start}" max="${e.date_window.end}" class="fld"><button class="btn g sm" data-evclear="${e.event_id}">Effacer</button></div>`}</div>`});
 h+=`</div><p class="sm mu">Si les deux compétitions sont proches, une priorité principale est à choisir et l’autre se maintient à volume réduit (règle du programme).</p></div>`;
 const rr=ALL.filter(s=>s.kind==='rr'),nx=rr.find(s=>stat(s)==='planned');
 h+=`<div class="card"><h2>Reprise course/marche · semaines 5 à 8</h2><p class="sm mu">Séances sans date dans le programme. Progression uniquement si les symptômes sont absents.${nx?` Prochaine : <b>${esc(nx.id)}</b>.`:''}</p>${rr.map(s=>drow(s).replace('</div>',`<input type="date" class="fld" data-mv="${s.id}" value="${s.date||''}" min="${START}" max="${END}" aria-label="Date pour ${s.id}"></div>`)).join('')}</div>`;
 h+=`<div class="card"><h2>Séances avant le HYROX du 17 décembre</h2><p class="sm mu">Séances datées, à adapter à ta tolérance et à ta charge réelle.</p>${ALL.filter(s=>s.kind==='dated'||s.id==='event_2026-12-17').sort(byDate).map(drow).join('')}</div>`;
 h+=`<div class="card"><h2>Phases indicatives, décembre à avril</h2><p class="sm mu">Orientations sans séances datées. Un modèle ne devient une séance du calendrier que si tu le planifies.</p>`;
 PH.forEach(p=>{h+=`<h3>${esc(p.name)} <span class="badge ind">Indicatif</span></h3><div class="sm mu">${fmt(p.date_window.start,{day:'numeric',month:'long'})} – ${fmt(p.date_window.end,{day:'numeric',month:'long',year:'numeric'})}${p.run_sessions_per_week_target?` · ${p.run_sessions_per_week_target.join('–')} sorties course par semaine`:''}</div>
  <ul class="sm">${p.objectives.map(o=>`<li>${esc(o)}</li>`).join('')}</ul><div class="sm mu">${p.rules.map(esc).join(' · ')}</div>`;
  TPL.filter(t=>t.phase===p.phase_id).forEach(t=>{h+=`<div class="rw"><span class="bib">${t.id}</span><span class="rt">${esc(t.title)}</span><input type="date" class="fld" id="pl_${t.id}" min="${p.date_window.start}" max="${p.date_window.end}"><button class="btn sm" data-plan="${t.id}">Planifier</button></div>`;
   ALL.filter(s=>s.kind==='tpl'&&s.id.startsWith(t.id+'#')).forEach(s=>h+=drow(s))})});
 const tp=D.future_phases.find(p=>p.phase_id==='taper');
 h+=`<h3>${esc(tp.name)} <span class="badge ind">Indicatif</span></h3><div class="sm mu">${tp.relative_to_event_days_before.join(' à ')} jours avant une compétition · ${tp.rules.map(esc).join(' · ')}</div></div>`;
 h+=`<div class="card"><h2>Séance libre</h2><p class="sm mu">Pour suivre une séance de musculation (Push, Pull, Legs), de course ou HYROX hors programme.</p><div class="grid2"><label class="fld">Titre<input id="ft" placeholder="Ex. Legs"></label><label class="fld">Date<input id="fd" type="date" value="${TODAY>=START&&TODAY<=END?TODAY:START}" min="${START}" max="${END}"></label><label class="fld">Discipline<select id="fk"><option value="strength">Musculation</option><option value="running">Course</option><option value="hyrox">HYROX</option></select></label></div><p><button class="btn" id="addfree">Ajouter</button></p>${ALL.filter(s=>s.kind==='free').sort(byDate).map(drow).join('')}</div>`;
 return h}

/* ---------- Adapter ---------- */
const lastCI=()=>{const k=Object.keys(st.checkins).sort().pop();return k?{d:k,...st.checkins[k]}:null};
function analyse(){const R=[],ci=lastCI(),thr=+st.thr||7,end=addD(TODAY,14);
 const up=ALL.filter(s=>s.date&&s.date>=TODAY&&s.date<=end&&stat(s)==='planned'&&!st.adapt[s.id]&&s.kind!=='class'&&s.kind!=='event').sort(byDate);
 const runs=up.filter(isRun);
 if(ci?.symptoms?.length)R.push({l:'red',t:'Signe à surveiller déclaré',x:`${ci.symptoms.join(' · ')}. ${rule('injury_symptoms').action}`,ids:runs,acts:['hold'],extra:ALL.some(s=>s.kind==='rr'&&stat(s)==='planned')?'La progression de la reprise course/marche est gelée : ne passe pas à la séance suivante sans réévaluation.':''});
 if(ci&&['modéré','difficile'].includes(ci.effort))R.push({l:'amber',t:'Effort facile ressenti comme trop dur',x:rule('easy_effort').action+' Le repère actuel de '+D.athlete_profile.current_easy_speed_kmh_approx+' km/h n’est pas une obligation.',ids:runs.filter(s=>!Q.has(s.type)),acts:['lighten']});
 if(ci&&(+ci.fatigue>=thr||+ci.soreness>=thr)){const q=up.filter(s=>Q.has(s.type)&&s.date<=addD(TODAY,7));R.push({l:'amber',t:`Fatigue ou courbatures au niveau d’alerte (≥ ${thr})`,x:'Les séances de qualité des 7 prochains jours sont à alléger, déplacer ou supprimer plutôt qu’à empiler. Les notes du programme prévoient de réduire ou supprimer en cas de fatigue.',ids:q,acts:['lighten','ef','shift','cancel']})}
 const stk=up.filter(s=>Q.has(s.type)).filter(s=>{const w=ALL.filter(a=>a.date&&Math.abs(diff(a.date,s.date))<=1&&a.id!==s.id&&stat(a)!=='cancelled');return w.some(a=>a.kind==='class')&&w.some(a=>/legs/i.test(a.title)&&!st.adapt[a.id])});
 if(stk.length)R.push({l:'amber',t:'Charge empilée',x:rule('stacked_load').condition+'. '+rule('stacked_load').action,ids:stk,acts:['lighten','shift','cancel']});
 const evs=ALL.filter(s=>s.kind==='event'&&s.date&&s.date>=TODAY);
 evs.forEach(e=>{const n=diff(e.date,TODAY),a=addD(e.date,-10),b=addD(e.date,-7);
  const w=ALL.filter(s=>s.date&&s.date>=a&&s.date<e.date&&(/legs/i.test(s.title)||s.type==='partial_simulation')&&stat(s)==='planned'&&!st.adapt[s.id]);
  R.push({l:n<=10?'amber':'info',t:`Affûtage avant ${e.title} (${fmt(e.date)})`,x:`Fenêtre de 7 à 10 jours avant : du ${fmt(a)} au ${fmt(b)}. ${rule('race_taper').action}${n<=10?` Départ dans ${n} jour${n>1?'s':''}.`:''}`,ids:n<=10?w:[],acts:['lighten','cancel']})});
 return R}
const actLbl={hold:'Suspendre',lighten:'Alléger',ef:'Remplacer par EF',cancel:'Annuler',shift:'Reporter d’1 jour'};
function rAdapt(){const ci=lastCI()||{},t=st.checkins[TODAY]||{};
 let h=`<div class="card"><h2>Point du jour · ${fmt(TODAY,{weekday:'long',day:'numeric',month:'long'})}</h2><form id="ci"><div class="grid2">
 <label class="fld">Fatigue (0–10)<input name="fatigue" type="number" min="0" max="10" value="${t.fatigue??''}"></label>
 <label class="fld">Courbatures (0–10)<input name="soreness" type="number" min="0" max="10" value="${t.soreness??''}"></label>
 <label class="fld">Effort facile ressenti<select name="effort">${[['','Non couru'],['facile','Facile (phrases complètes)'],['modéré','Modéré'],['difficile','Difficile']].map(([v,l])=>`<option value="${v}" ${t.effort===v?'selected':''}>${l}</option>`).join('')}</select></label>
 <label class="fld">Seuil d’alerte fatigue/courbatures<input name="thr" type="number" min="1" max="10" value="${st.thr}"></label></div>
 <fieldset style="border:1px solid var(--ln);border-radius:4px;margin:10px 0"><legend class="sm mu">Signes à surveiller</legend>${SYM.map(x=>`<label style="display:block"><input type="checkbox" name="sym" value="${esc(x)}" ${(t.symptoms||[]).includes(x)?'checked':''}> ${esc(x)}</label>`).join('')}</fieldset>
 <button class="btn">Enregistrer et analyser</button> <span class="sm mu">Le seuil d’alerte est un réglage personnel, pas une valeur du programme.</span></form></div>`;
 const R=analyse();
 h+=R.length?R.map((r,i)=>`<div class="alert ${r.l}"><h3>${esc(r.t)}</h3><p>${esc(r.x)}</p>${r.extra?`<p><b>${esc(r.extra)}</b></p>`:''}${r.ids.map(s=>`<div class="rw"><button class="row" data-open="${esc(s.id)}"><span class="bib">${esc(s.id)}</span><span class="rt">${esc(s.title)}</span><span class="mu">${fmt(s.date)}</span></button>${r.acts.map(a=>`<button class="btn g sm" data-adapt="${a}" data-id="${esc(s.id)}">${actLbl[a]}</button>`).join('')}</div>`).join('')}</div>`).join(''):`<div class="alert info"><b>Aucune alerte.</b> Enregistre ton point du jour pour recevoir des recommandations basées sur les règles de ton programme.</div>`;
 const ad=ALL.filter(s=>st.adapt[s.id]).sort(byDate);
 if(ad.length)h+=`<div class="card"><h2>Séances adaptées</h2>${ad.map(s=>`<div class="rw"><button class="row" data-open="${esc(s.id)}"><span class="bib">${esc(s.id)}</span><span class="rt">${esc(s.title)}</span><span class="mu">${s.date?fmt(s.date):''}</span><span class="st s-partial">⚑ ${AL[st.adapt[s.id]]}</span></button><button class="btn g sm" data-adapt="clear" data-id="${esc(s.id)}">Rétablir</button></div>`).join('')}</div>`;
 return h}

/* ---------- Suivi ---------- */
let metric='average_speed_kmh';
const MET={average_speed_kmh:'Vitesse moyenne (km/h)',average_hr_bpm:'FC moyenne (bpm)',rpe_1_to_10:'Effort ressenti (1–10)',soreness_0_to_10:'Courbatures (0–10)',pain_during_0_to_10:'Douleur pendant (0–10)',pain_24h_0_to_10:'Douleur à 24 h (0–10)',actual_duration_min:'Durée réelle (min)',actual_distance_km:'Distance (km)'};
function chart(pts,label){if(pts.length<2)return `<p class="mu">Au moins deux résultats avec « ${esc(label)} » sont nécessaires pour tracer la courbe.</p>`;
 const W=640,H=220,p=38,xs=pts.map(q=>pd(q.d).getTime()),ys=pts.map(q=>q.v),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
 const X=t=>p+(x1===x0?.5:(t-x0)/(x1-x0))*(W-2*p),Y=v=>H-p-(y1===y0?.5:(v-y0)/(y1-y0))*(H-2*p);
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(label)} au fil du temps"><line class="ax" x1="${p}" y1="${H-p}" x2="${W-p}" y2="${H-p}"/><line class="ax" x1="${p}" y1="${p}" x2="${p}" y2="${H-p}"/>
 <polyline class="ln" points="${pts.map(q=>X(pd(q.d).getTime())+','+Y(q.v)).join(' ')}"/>${pts.map(q=>`<circle class="pt" cx="${X(pd(q.d).getTime())}" cy="${Y(q.v)}" r="4"><title>${fmt(q.d)} : ${q.v}</title></circle>`).join('')}
 <text x="4" y="${p+4}">${y1}</text><text x="4" y="${H-p}">${y0}</text><text x="${p}" y="${H-12}">${fmt(pts[0].d)}</text><text x="${W-p}" y="${H-12}" text-anchor="end">${fmt(pts[pts.length-1].d)}</text></svg>`}
function rPerf(){const L=ALL.filter(s=>st.logs[s.id]).map(s=>({s,l:st.logs[s.id],d:st.logs[s.id].at||s.date||TODAY})).sort((a,b)=>a.d.localeCompare(b.d));
 const done=L.filter(x=>['completed','partial'].includes(x.l.status)),pl=ALL.filter(s=>s.date&&s.date<=TODAY&&s.kind!=='class'&&s.kind!=='free'&&s.kind!=='event');
 const runMin=done.filter(x=>isRun(x.s)).reduce((a,x)=>a+(+x.l.actual_duration_min||0),0),km=done.filter(x=>isRun(x.s)).reduce((a,x)=>a+(+x.l.actual_distance_km||0),0);
 const rp=done.filter(x=>x.l.rpe_1_to_10).slice(-5),rpm=rp.length?(rp.reduce((a,x)=>a+x.l.rpe_1_to_10,0)/rp.length).toFixed(1):'—';
 const k=(n,t)=>`<div class="card kpi"><div class="num">${n}</div><div class="mu sm">${t}</div></div>`;
 let h=`<div class="kpis">${k(done.length,'séances faites ou partielles')}${k(pl.length?pl.filter(s=>['completed','partial'].includes(stat(s))).length+' / '+pl.length:'—','séances datées échues réalisées')}${k(runMin,'minutes de course saisies')}${k(km.toFixed(1),'km courus saisis')}${k(rpm,'effort moyen, 5 dernières')}</div>`;
 const pts=L.filter(x=>x.l[metric]!==undefined&&x.l[metric]!=='').map(x=>({d:x.d,v:+x.l[metric]}));
 h+=`<div class="card"><div class="rw" style="border:0;justify-content:space-between"><h2>Évolution</h2><label class="fld"><select id="met">${Object.entries(MET).map(([a,b])=>`<option value="${a}" ${a===metric?'selected':''}>${b}</option>`).join('')}</select></label></div>${chart(pts,MET[metric])}</div>`;
 h+=`<div class="card"><h2>Journal</h2>${L.length?`<div style="overflow-x:auto"><table><tr><th>Date</th><th>Séance</th><th>Statut</th><th>Durée</th><th>Dist.</th><th>km/h</th><th>FC</th><th>Effort</th><th>Douleur</th></tr>${[...L].reverse().map(x=>`<tr data-open="${esc(x.s.id)}"><td>${fmt(x.d)}</td><td><span class="bib">${esc(x.s.id)}</span> ${esc(x.s.title)}</td><td>${SL[x.l.status]}</td><td>${x.l.actual_duration_min??''}</td><td>${x.l.actual_distance_km??''}</td><td>${x.l.average_speed_kmh??''}</td><td>${x.l.average_hr_bpm??''}</td><td>${x.l.rpe_1_to_10??''}</td><td>${x.l.pain_during_0_to_10??''}${x.l.symptoms?.length?' ⚠':''}</td></tr>`).join('')}</table></div>`:'<p class="mu">Aucun résultat enregistré. Ouvre une séance depuis le calendrier pour saisir ton premier résultat.</p>'}</div>`;
 return h}

/* ---------- Données ---------- */
let exp='';
function rData(){return `<div class="card"><h2>Sauvegarde</h2><p class="sm mu">Copie ce texte et garde-le : il contient tes résultats, tes déplacements, tes adaptations et tes séances libres.</p><textarea class="big" id="exp" readonly>${esc(exp||JSON.stringify(st))}</textarea><p class="rw" style="border:0"><button class="btn" id="cp">Copier</button><button class="btn g" id="csv">Journal en CSV</button><button class="btn g" id="jsn">Sauvegarde complète</button></p></div>
 <div class="card"><h2>Restauration</h2><textarea class="big" id="imp" placeholder="Colle ici une sauvegarde complète"></textarea><p class="rw" style="border:0"><button class="btn" id="doimp">Restaurer</button><span class="sm mu" id="impmsg"></span></p></div>
 <div class="card"><h2>Tout effacer</h2><p class="sm mu">Supprime les saisies de ce navigateur. Le programme n’est pas modifié.</p><button class="btn g" id="wipe">Effacer mes saisies</button></div>
 <div class="card"><h2>Lecture des données</h2><p class="sm">Défini = séance du programme (reprise semaines 5 à 8, séances datées jusqu’au 17 décembre). Indicatif = phase ou modèle, sans date. Les identifiants de séances sont ceux du fichier JSON. Les cours HYROX du mercredi soir et du samedi matin viennent de la structure hebdomadaire.</p></div>`}

/* ---------- Événements ---------- */
function setAdapt(id,a){if(a==='clear')delete st.adapt[id];else if(a==='shift'){const s=ALL.find(x=>x.id===id);if(s?.date)st.moves[id]=addD(s.date,1)}else st.adapt[id]=a;save()}
document.addEventListener('click',e=>{const t=e.target.closest('[data-open],[data-tab],[data-mo],[data-adapt],[data-plan],[data-del],[data-clearlog],[data-evclear],#addfree,#cp,#csv,#jsn,#doimp,#wipe');if(!t)return;
 if(t.dataset.open){openSession(t.dataset.open);return}
 if(t.dataset.tab){tab=t.dataset.tab;render();return}
 if(t.dataset.mo){mi+=+t.dataset.mo;render();return}
 if(t.dataset.adapt){setAdapt(t.dataset.id,t.dataset.adapt);const o=$('#dlg').open;if(o)$('#dlg').close();render();return}
 if(t.dataset.plan){const v=$('#pl_'+t.dataset.plan).value;if(!v)return;st.planned.push({iid:t.dataset.plan+'#'+Date.now().toString(36),tpl:t.dataset.plan,date:v});save();render();return}
 if(t.dataset.del){const id=t.dataset.del;st.custom=st.custom.filter(c=>c.id!==id);st.planned=st.planned.filter(p=>p.iid!==id);delete st.logs[id];delete st.moves[id];delete st.adapt[id];save();$('#dlg').close();render();return}
 if(t.dataset.clearlog){delete st.logs[t.dataset.clearlog];save();$('#dlg').close();render();return}
 if(t.dataset.evclear){delete st.eventDates[t.dataset.evclear];save();render();return}
 switch(t.id){
 case'addfree':{const ti=$('#ft').value.trim(),d=$('#fd').value;if(!ti||!d)return;st.custom.push({id:'libre_'+Date.now().toString(36),date:d,title:ti,disc:$('#fk').value});save();render();break}
 case'cp':{const x=$('#exp');x.select();try{navigator.clipboard.writeText(x.value)}catch(_){document.execCommand&&document.execCommand('copy')}break}
 case'csv':{const c=['session_id;date;status;actual_duration_min;actual_distance_km;average_speed_kmh;average_hr_bpm;max_hr_bpm;rpe;pain_during;pain_24h;soreness;symptoms;notes'];
  Object.entries(st.logs).forEach(([id,l])=>c.push([id,l.at||'',l.status,l.actual_duration_min,l.actual_distance_km,l.average_speed_kmh,l.average_hr_bpm,l.max_hr_bpm,l.rpe_1_to_10,l.pain_during_0_to_10,l.pain_24h_0_to_10,l.soreness_0_to_10,(l.symptoms||[]).join('|'),(l.notes||'').replace(/[;\n]/g,' ')].map(v=>v??'').join(';')));exp=c.join('\n');render();break}
 case'jsn':exp='';render();break;
 case'doimp':{try{const o=JSON.parse($('#imp').value);if(typeof o!=='object'||!o.logs)throw 0;st=Object.assign({},DEF,o);save();render()}catch(_){$('#impmsg').textContent='Texte non reconnu : colle une sauvegarde complète.'}break}
 case'wipe':if(t.dataset.arm){st=Object.assign({},DEF);save();render()}else{t.dataset.arm=1;t.textContent='Confirmer : tout effacer'}break}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.mv){if(t.value)st.moves[t.dataset.mv]=t.value;else delete st.moves[t.dataset.mv];save();render()}
 else if(t.dataset.ev){if(t.value)st.eventDates[t.dataset.ev]=t.value;else delete st.eventDates[t.dataset.ev];save();render()}
 else if(t.id==='met'){metric=t.value;render()}});
document.addEventListener('submit',e=>{if(e.target.id!=='ci')return;e.preventDefault();const g=new FormData(e.target);
 st.thr=+g.get('thr')||7;st.checkins[TODAY]={fatigue:g.get('fatigue'),soreness:g.get('soreness'),effort:g.get('effort'),symptoms:g.getAll('sym')};save();render()});
render();
</script>
</body>
</html>
