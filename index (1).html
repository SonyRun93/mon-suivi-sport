<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Barlow,system-ui,"Segoe UI",sans-serif}
h1,h2,h3,.bib,.num{font-family:"Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.01em;margin:0}
h2{font-size:24px;margin:0 0 8px}h3{font-size:19px;margin:16px 0 6px}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:8px 0 14px}
h1{font-size:34px;line-height:1.05}
.count{text-align:right}.count .num{font-size:56px;font-weight:700;line-height:.9;color:var(--ac)}
.mu{color:var(--mu)}.sm{font-size:13px}
nav{display:flex;gap:4px;overflow-x:auto;border-bottom:2px solid var(--ln);margin-bottom:16px}
nav button{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:10px 14px;font:600 16px "Barlow Condensed","Arial Narrow",sans-serif;color:var(--mu);cursor:pointer;white-space:nowrap}
nav button[aria-current=true]{color:var(--ink);border-color:var(--ac)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:6px;padding:14px;margin-bottom:14px}
.btn{background:var(--ac);color:var(--acf);border:0;border-radius:4px;padding:7px 14px;font-weight:600;cursor:pointer}

.badge{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:10px;border:1px solid var(--ln)}
.badge.def{background:var(--ink);color:var(--bg);border-color:var(--ink)}.badge.ind{border-style:dashed}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.dow{font:600 14px "Barlow Condensed",sans-serif;color:var(--mu);padding:2px 4px}

.cell.off{background:none;border:0}.cell.today{outline:2px solid var(--ac)}

.chip.k-class{border-color:var(--ln);border-left-color:var(--mu);color:var(--mu)}
.chip.k-event{background:var(--ink);color:var(--bg);font-weight:700}

.chip.k-free{border-left-color:var(--ac)}
.chip.s-completed{border-left-color:var(--ok)}.chip.s-partial{border-left-color:var(--wn)}
.chip.s-cancelled,.chip.a-cancel,.chip.a-hold{text-decoration:line-through;opacity:.6}
.chip.s-completed::before{content:"✓ "}
.row,.rw{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row{width:100%;background:none;border:0;border-bottom:1px solid var(--ln);padding:7px 2px;text-align:left;cursor:pointer}
.rw{border-bottom:1px solid var(--ln)}.rw .row{border:0;flex:1}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}

.fld input,.fld select,.fld textarea{background:var(--bg);border:1px solid var(--ln);border-radius:4px;padding:6px 8px;color:var(--ink);min-width:0}
.alert{border-left:6px solid var(--wn);background:var(--sf);border-radius:4px;padding:10px 12px;margin-bottom:12px;border-top:1px solid var(--ln);border-right:1px solid var(--ln);border-bottom:1px solid var(--ln)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi .num{font-size:38px;font-weight:700;line-height:1}
dialog{border:1px solid var(--ink);border-radius:8px;background:var(--sf);color:var(--ink);padding:18px;width:min(680px,94vw);max-height:92vh}
dialog::backdrop{background:rgba(5,12,22,.6)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--ln)}

@media(prefers-reduced-motion:no-preference){.count .num{animation:in .6s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}}}

function chip(s){const x=stat(s);return `<button class="chip k-${s.kind} s-${x} ${st.adapt[s.id]?'a-'+st.adapt[s.id]:''} ${s.dq==='indicative_calendar_session'?'ind':''}" data-open="${esc(s.id)}" title="${esc(s.title)}">${esc(lbl(s))}${st.adapt[s.id]?' ⚑':''}</button>`}
function rCal(){const m=months[mi],y=m.getFullYear(),mo=m.getMonth(),n=new Date(y,mo+1,0).getDate(),off=(m.getDay()+6)%7,ms=iso(m).slice(0,7);
 let h=D.events.filter(e=>!e.date&&!st.eventDates[e.event_id]&&e.date_window.start.slice(0,7)<=ms&&e.date_window.end.slice(0,7)>=ms).map(e=>`<div class="alert info sm"><b>${esc(e.name)}</b> : date à confirmer, fenêtre du ${fmt(e.date_window.start,{day:'numeric',month:'long'})} au ${fmt(e.date_window.end,{day:'numeric',month:'long',year:'numeric'})}. Saisis-la dans l’onglet Règles et ajouts quand tu la connais.</div>`).join('');

 h+=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].map(d=>`<div class="dow">${d}</div>`).join('')+'<div class="cell off"></div>'.repeat(off);
 for(let d=1;d<=n;d++){const ds=`${y}-${pad(mo+1)}-${pad(d)}`,it=ALL.filter(s=>s.date===ds).sort(byDate),over=it.filter(s=>stat(s)!=='cancelled').length>MAXD;

 return h+`</div><div class="legend"><span><span class="sw" style="border-left:5px solid var(--ac)"></span>Course</span><span><span class="sw" style="border-left:5px solid var(--sg)"></span>Musculation (Push, Pull, Legs)</span><span><span class="sw" style="border-left:5px solid var(--mu)"></span>Cours HYROX fixe</span><span><span class="sw" style="background:var(--ink)"></span>Compétition</span></div><p class="sm mu">Trait plein = séance définie ou fixe · pointillé = séance proposée, indicative et adaptable · ⚑ = adaptée · ⚠ = plus de ${MAXD} séances ce jour. Clique sur un numéro de jour pour ouvrir sa semaine détaillée.</p>`}

 ${f('pain_during_0_to_10','Douleur pendant (0–10)','number','min="0" max="10"')}${f('pain_location','Localisation de la douleur','text')}${f('pain_24h_0_to_10','Douleur à 24 h (0–10)','number','min="0" max="10"')}

 const up=ALL.filter(s=>s.date>=TODAY&&s.date<=end&&stat(s)==='planned'&&!st.adapt[s.id]&&s.kind!=='class'&&s.kind!=='event').sort(byDate),runs=up.filter(isRun);
 if(ci?.symptoms?.length)out.push({l:'red',t:'Signe à surveiller déclaré',x:`${ci.symptoms.join(' · ')}. ${RU.injury}`,ids:runs,acts:['hold'],extra:'La progression de la course est gelée : ne passe pas à la séance suivante sans réévaluation.'});
 if(ci&&['modéré','difficile'].includes(ci.effort))out.push({l:'amber',t:'Effort facile ressenti comme trop dur',x:`${RU.easy} Réduis la vitesse ou la durée. Le repère actuel de ${D.athlete_profile.current_easy_speed_kmh_approx} km/h n’est pas une obligation.`,ids:runs.filter(s=>!isQ(s)),acts:['lighten']});
 if(ci&&(+ci.fatigue>=thr||+ci.soreness>=thr))out.push({l:'amber',t:`Fatigue ou courbatures au niveau d’alerte (≥ ${thr})`,x:'Sur les 7 prochains jours, les courses de qualité et les sorties longues sont à alléger, déplacer ou supprimer. Les notes du calendrier prévoient déjà de raccourcir ou supprimer en cas de fatigue.',ids:up.filter(s=>s.date<=addD(TODAY,7)&&(isQ(s)||s.type==='long_easy_run')),acts:['lighten','ef','shift','cancel']});
 const sun=up.filter(s=>s.type==='long_easy_run').filter(s=>{const c=ALL.find(a=>a.kind==='class'&&a.date===addD(s.date,-1));return c&&st.logs[c.id]?.hyrox_class_intensity==='élevée'});
 if(sun.length)out.push({l:'amber',t:'Cours HYROX intense la veille',x:RU.sunday,ids:sun,acts:['lighten','cancel']});
 const stk=up.filter(isQ).filter(s=>{const w=ALL.filter(a=>Math.abs(diff(a.date,s.date))<=1&&a.id!==s.id&&stat(a)!=='cancelled'&&!st.adapt[a.id]);return w.some(a=>a.kind==='class')&&w.some(isLegs)});
 if(stk.length)out.push({l:'amber',t:'Charge empilée',x:RU.stacked,ids:stk,acts:['lighten','shift','cancel']});
 const days={};ALL.filter(s=>s.date>=TODAY&&s.date<=end&&stat(s)!=='cancelled'&&s.kind!=='event').forEach(s=>(days[s.date]=days[s.date]||[]).push(s));
 Object.entries(days).filter(([,v])=>v.length>MAXD).forEach(([d,v])=>out.push({l:'amber',t:`Plus de ${MAXD} séances le ${fmt(d)}`,x:'Le maximum est de deux séances par jour.',ids:v.filter(s=>s.kind!=='class'),acts:['shift','cancel']}));
 ALL.filter(s=>s.kind==='event'&&s.date>=TODAY).forEach(e=>{const n=diff(e.date,TODAY),a=addD(e.date,-10);
  const w=ALL.filter(s=>s.date>=a&&s.date<e.date&&(isLegs(s)||isQ(s))&&stat(s)==='planned'&&!st.adapt[s.id]);
  out.push({l:n<=10?'amber':'info',t:`Affûtage avant ${e.title} (${fmt(e.date)})`,x:`Fenêtre de 7 à 10 jours avant : du ${fmt(a)} au ${fmt(addD(e.date,-7))}. ${RU.taper}${n<=10?` Départ dans ${n} jour${n>1?'s':''}.`:''}`,ids:n<=10?w:[],acts:['lighten','cancel']})});
 return out}
const actLbl={hold:'Suspendre',lighten:'Alléger',ef:'Remplacer par EF',cancel:'Annuler',shift:'Reporter d’1 jour'};
function rAdapt(){const t=st.checkins[TODAY]||{};
 let h=`<div class="card"><h2>Point du jour · ${fmt(TODAY,{weekday:'long',day:'numeric',month:'long'})}</h2><form id="ci"><div class="grid2">
 <label class="fld">Fatigue (0–10)<input name="fatigue" type="number" min="0" max="10" value="${t.fatigue??''}"></label>
 <label class="fld">Courbatures (0–10)<input name="soreness" type="number" min="0" max="10" value="${t.soreness??''}"></label>
 <label class="fld">Effort facile ressenti<select name="effort">${[['','Non couru'],['facile','Facile (phrases complètes)'],['modéré','Modéré'],['difficile','Difficile']].map(([v,l])=>`<option value="${v}" ${t.effort===v?'selected':''}>${l}</option>`).join('')}</select></label>
 <label class="fld">Seuil d’alerte fatigue/courbatures<input name="thr" type="number" min="1" max="10" value="${st.thr}"></label></div>
 <fieldset style="border:1px solid var(--ln);border-radius:4px;margin:10px 0"><legend class="sm mu">Signes à surveiller</legend>${SYM.map(x=>`<label style="display:block"><input type="checkbox" name="sym" value="${esc(x)}" ${(t.symptoms||[]).includes(x)?'checked':''}> ${esc(x)}</label>`).join('')}</fieldset>
 <button class="btn">Enregistrer et analyser</button> <span class="sm mu">Le seuil d’alerte est un réglage personnel, pas une valeur du calendrier.</span></form></div>`;
 const A=analyse();
 h+=A.length?A.map(r=>`<div class="alert ${r.l}"><h3>${esc(r.t)}</h3><p>${esc(r.x)}</p>${r.extra?`<p><b>${esc(r.extra)}</b></p>`:''}${r.ids.map(s=>`<div class="rw"><button class="row" data-open="${esc(s.id)}"><span class="bib">${esc(s.id)}</span><span class="rt">${esc(s.title)}</span><span class="mu">${fmt(s.date)}</span></button>${r.acts.map(a=>`<button class="btn g sm" data-adapt="${a}" data-id="${esc(s.id)}">${actLbl[a]}</button>`).join('')}</div>`).join('')}</div>`).join(''):`<div class="alert info"><b>Aucune alerte.</b> Enregistre ton point du jour pour obtenir des recommandations fondées sur les règles du calendrier.</div>`;
 const ad=ALL.filter(s=>st.adapt[s.id]).sort(byDate);
 if(ad.length)h+=`<div class="card"><h2>Séances adaptées</h2>${ad.map(s=>`<div class="rw"><button class="row" data-open="${esc(s.id)}"><span class="bib">${esc(s.id)}</span><span class="rt">${esc(s.title)}</span><span class="mu">${fmt(s.date)}</span><span class="st s-partial">⚑ ${AL[st.adapt[s.id]]}</span></button><button class="btn g sm" data-adapt="clear" data-id="${esc(s.id)}">Rétablir</button></div>`).join('')}</div>`;
 return h}

/* ---------- Suivi ---------- */
let metric='average_speed_kmh',df='all';
const MET={average_speed_kmh:'Vitesse moyenne (km/h)',weekly_run_min:'Minutes de course par semaine',average_hr_bpm:'FC moyenne (bpm)',rpe_1_to_10:'Effort ressenti (1–10)',soreness_0_to_10:'Courbatures (0–10)',pain_during_0_to_10:'Douleur pendant (0–10)',pain_24h_0_to_10:'Douleur à 24 h (0–10)',actual_duration_min:'Durée réelle (min)',actual_distance_km:'Distance (km)'};
function chart(pts,label){if(pts.length<2)return `<p class="mu">Au moins deux résultats avec « ${esc(label)} » sont nécessaires pour tracer la courbe.</p>`;
 const W=640,H=220,p=38,xs=pts.map(q=>pd(q.d).getTime()),ys=pts.map(q=>q.v),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
 const X=t=>p+(x1===x0?.5:(t-x0)/(x1-x0))*(W-2*p),Y=v=>H-p-(y1===y0?.5:(v-y0)/(y1-y0))*(H-2*p);
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(label)} au fil du temps"><line class="ax" x1="${p}" y1="${H-p}" x2="${W-p}" y2="${H-p}"/><line class="ax" x1="${p}" y1="${p}" x2="${p}" y2="${H-p}"/>
 <polyline class="ln" points="${pts.map(q=>X(pd(q.d).getTime())+','+Y(q.v)).join(' ')}"/>${pts.map(q=>`<circle class="pt" cx="${X(pd(q.d).getTime())}" cy="${Y(q.v)}" r="4"><title>${fmt(q.d)} : ${q.v}</title></circle>`).join('')}
 <text x="4" y="${p+4}">${+y1.toFixed(1)}</text><text x="4" y="${H-p}">${+y0.toFixed(1)}</text><text x="${p}" y="${H-12}">${fmt(pts[0].d)}</text><text x="${W-p}" y="${H-12}" text-anchor="end">${fmt(pts[pts.length-1].d)}</text></svg>`}
function rPerf(){const L=ALL.filter(s=>st.logs[s.id]).map(s=>({s,l:st.logs[s.id],d:st.logs[s.id].at||s.date})).sort((a,b)=>a.d.localeCompare(b.d)).filter(x=>df==='all'||(df==='run'&&x.s.kind==='run')||(df==='strength'&&x.s.kind==='strength')||(df==='hyrox'&&(x.s.kind==='class'||x.s.kind==='event')));
 const ok=x=>['completed','partial'].includes(x.l.status),done=L.filter(ok),dr=done.filter(x=>x.s.kind==='run'),pl=ALL.filter(s=>s.date<=TODAY&&s.kind!=='free'&&s.kind!=='event');
 const runMin=dr.reduce((a,x)=>a+(+x.l.actual_duration_min||0),0),km=dr.reduce((a,x)=>a+(+x.l.actual_distance_km||0),0);
 const rp=done.filter(x=>x.l.rpe_1_to_10).slice(-5),rpm=rp.length?(rp.reduce((a,x)=>a+x.l.rpe_1_to_10,0)/rp.length).toFixed(1):'—';
 const k=(n,t)=>`<div class="card kpi"><div class="num">${n}</div><div class="mu sm">${t}</div></div>`;
 let h=`<div class="kpis">${k(done.length,'séances faites ou partielles')}${k(pl.length?pl.filter(s=>['completed','partial'].includes(stat(s))).length+' / '+pl.length:'—','séances échues réalisées')}${k(runMin,'minutes de course saisies')}${k(km.toFixed(1),'km courus saisis')}${k(rpm,'effort moyen, 5 dernières')}</div>`;
 let pts;if(metric==='weekly_run_min'){const w={};dr.forEach(x=>{const m=mon(x.d);w[m]=(w[m]||0)+(+x.l.actual_duration_min||0)});pts=Object.keys(w).sort().map(d=>({d,v:w[d]}))}else pts=L.filter(x=>x.l[metric]!==undefined).map(x=>({d:x.d,v:+x.l[metric]}));
 h+=`<div class="card"><div class="rw" style="border:0;justify-content:space-between"><h2>Évolution</h2><span class="rw" style="border:0"><label class="fld"><select id="df" aria-label="Discipline">${[['all','Tout'],['run','Course'],['strength','Musculation'],['hyrox','HYROX']].map(([a,b])=>`<option value="${a}" ${a===df?'selected':''}>${b}</option>`).join('')}</select></label><label class="fld"><select id="met" aria-label="Mesure">${Object.entries(MET).map(([a,b])=>`<option value="${a}" ${a===metric?'selected':''}>${b}</option>`).join('')}</select></label></span></div>${chart(pts,MET[metric])}</div>`;
 h+=`<div class="card"><h2>Journal</h2>${L.length?`<div style="overflow-x:auto"><table><tr><th>Date</th><th>Séance</th><th>Statut</th><th>Durée</th><th>Dist.</th><th>km/h</th><th>FC</th><th>Effort</th><th>Douleur</th></tr>${[...L].reverse().map(x=>`<tr data-open="${esc(x.s.id)}"><td>${fmt(x.d)}</td><td>${esc(x.s.title)}</td><td>${SL[x.l.status]}</td><td>${x.l.actual_duration_min??''}</td><td>${x.l.actual_distance_km??''}</td><td>${x.l.average_speed_kmh??''}</td><td>${x.l.average_hr_bpm??''}</td><td>${x.l.rpe_1_to_10??''}</td><td>${x.l.pain_during_0_to_10??''}${x.l.symptoms?.length?' ⚠':''}</td></tr>`).join('')}</table></div>`:'<p class="mu">Aucun résultat enregistré. Ouvre une séance depuis la semaine ou le calendrier pour saisir ton premier résultat.</p>'}</div>`;
 return h}

/* ---------- Règles et ajouts ---------- */
function drow(s){return `<button class="row" data-open="${esc(s.id)}"><span class="bib">${esc(s.id)}</span><span class="rt">${esc(s.title)}</span><span class="mu">${fmt(s.date)}</span><span class="st s-${stat(s)}">${SL[stat(s)]}</span></button>`}
function rProg(){const ap=D.athlete_profile;
 let h=`<div class="card"><h2>Dates à confirmer</h2><div class="grid2">`;
 D.events.forEach(e=>{const dt=e.date||st.eventDates[e.event_id];h+=`<div><b>${esc(e.name)}</b> <span class="badge ${e.date?'def':'ind'}">${e.date?'Date confirmée':dt?'Date saisie par toi':'À confirmer'}</span><br><span class="sm mu">${e.date?fmt(e.date,{day:'numeric',month:'long',year:'numeric'}):`Fenêtre ${fmt(e.date_window.start,{day:'numeric',month:'short'})} – ${fmt(e.date_window.end,{day:'numeric',month:'short',year:'numeric'})}`}${e.goal_time_min_range?` · objectif ${e.goal_time_min_range.join('–')} min (${e.goal_pace_min_per_km.join('–')}/km, cible théorique)`:''}</span>
  ${e.date?'':`<div class="rw" style="border:0"><input type="date" data-ev="${e.event_id}" value="${dt||''}" min="${e.date_window.start}" max="${e.date_window.end}" class="fld" aria-label="Date de ${esc(e.name)}"><button class="btn g sm" data-evclear="${e.event_id}">Effacer</button></div>`}</div>`});
 h+=`</div><p class="sm mu">Le calendrier prévient que les dates 2027 ne sont pas confirmées : les séances sont à recalibrer quand elles le seront.</p></div>`;
 h+=`<div class="card"><h2>Règles du calendrier</h2><ul>${R.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p class="sm mu">Repère actuel : ${esc(ap.current_status)} Course facile ≈ ${ap.current_easy_speed_kmh_approx} km/h, ≈ ${ap.current_easy_hr_bpm_approx} bpm. Test : ${esc(ap.easy_talk_test.toLowerCase())}.</p></div>`;
 h+=`<div class="card"><h2>Séance libre</h2><p class="sm mu">Pour suivre une séance hors calendrier. Le calendrier ne détaille pas les exercices de musculation : tu peux les noter dans la fiche de la séance.</p><div class="grid2"><label class="fld">Titre<input id="ft" placeholder="Ex. Legs"></label><label class="fld">Date<input id="fd" type="date" value="${TODAY>=START&&TODAY<=END?TODAY:START}" min="${START}" max="${END}"></label><label class="fld">Discipline<select id="fk"><option value="strength">Musculation</option><option value="running">Course</option><option value="hyrox">HYROX</option></select></label></div><p><button class="btn" id="addfree">Ajouter</button></p>${ALL.filter(s=>s.kind==='free').sort(byDate).map(drow).join('')}</div>`;
 return h}

/* ---------- Données ---------- */
let exp='';
function rData(){return `<div class="card"><h2>Sauvegarde</h2><p class="sm mu">Copie ce texte et garde-le : il contient tes résultats, tes déplacements, tes adaptations et tes séances libres.</p><textarea class="big" id="exp" readonly>${esc(exp||JSON.stringify(st))}</textarea><p class="rw" style="border:0"><button class="btn" id="cp">Copier</button><button class="btn g" id="csv">Journal en CSV</button><button class="btn g" id="jsn">Sauvegarde complète</button></p></div>
 <div class="card"><h2>Restauration</h2><textarea class="big" id="imp" placeholder="Colle ici une sauvegarde complète"></textarea><p class="rw" style="border:0"><button class="btn" id="doimp">Restaurer</button><span class="sm mu" id="impmsg"></span></p></div>
 <div class="card"><h2>Tout effacer</h2><p class="sm mu">Supprime les saisies de ce navigateur. Le calendrier n’est pas modifié.</p><button class="btn g" id="wipe">Effacer mes saisies</button></div>
 <div class="card"><h2>Lecture des données</h2><p class="sm">Source : calendrier détaillé version ${esc(D.metadata.version)}. <b>Défini</b> = prochaine séance rapportée, cours HYROX fixes, compétition du 17 décembre. <b>Proposé</b> = séance indicative, adaptable selon ta récupération et tes symptômes. Les identifiants sont ceux du fichier. La musculation est décrite par bloc (Push, Pull, Legs), sans exercices.</p></div>`}

/* ---------- Événements ---------- */
function setAdapt(id,a){if(a==='clear')delete st.adapt[id];else if(a==='shift'){const s=ALL.find(x=>x.id===id);if(s)st.moves[id]=addD(s.date,1)}else st.adapt[id]=a;save()}
document.addEventListener('click',e=>{const t=e.target.closest('[data-open],[data-tab],[data-mo],[data-adapt],[data-wk],[data-wk-nav],[data-quick],[data-del],[data-clearlog],[data-evclear],#addfree,#cp,#csv,#jsn,#doimp,#wipe');if(!t)return;
 const q=t.dataset;
 if(q.open){openSession(q.open);return}
 if(q.tab){tab=q.tab;render();return}
 if(q.mo){mi+=+q.mo;render();return}
 if(q.wk){wi=Math.max(0,Math.min(NW-1,Math.floor(diff(q.wk,W0)/7)));tab='sem';render();return}
 if(q.wkNav){wi+=+q.wkNav;render();return}
 if(q.quick){const s=ALL.find(x=>x.id===q.quick);st.logs[q.quick]={status:'completed',planned_duration_min:s.dur||undefined,symptoms:[],at:s.date};save();render();return}
 if(q.adapt){setAdapt(q.id,q.adapt);if($('#dlg').open)$('#dlg').close();render();return}
 if(q.del){st.custom=st.custom.filter(c=>c.id!==q.del);['logs','moves','adapt'].forEach(k=>delete st[k][q.del]);save();$('#dlg').close();render();return}
 if(q.clearlog){delete st.logs[q.clearlog];save();$('#dlg').close();render();return}
 if(q.evclear){delete st.eventDates[q.evclear];save();render();return}
 switch(t.id){
 case'addfree':{const ti=$('#ft').value.trim(),d=$('#fd').value;if(!ti||!d)return;st.custom.push({id:'libre_'+Date.now().toString(36),date:d,title:ti,disc:$('#fk').value});save();render();break}
 case'cp':{const x=$('#exp');x.select();try{navigator.clipboard.writeText(x.value)}catch(_){document.execCommand&&document.execCommand('copy')}break}
 case'csv':{const c=['session_id;date;status;actual_duration_min;actual_distance_km;average_speed_kmh;average_hr_bpm;max_hr_bpm;rpe;pain_during;pain_24h;soreness;symptoms;notes'];
  Object.entries(st.logs).forEach(([id,l])=>c.push([id,l.at||'',l.status,l.actual_duration_min,l.actual_distance_km,l.average_speed_kmh,l.average_hr_bpm,l.max_hr_bpm,l.rpe_1_to_10,l.pain_during_0_to_10,l.pain_24h_0_to_10,l.soreness_0_to_10,(l.symptoms||[]).join('|'),(l.notes||'').replace(/[;\n]/g,' ')].map(v=>v??'').join(';')));exp=c.join('\n');render();break}
 case'jsn':exp='';render();break;
 case'doimp':{try{const o=JSON.parse($('#imp').value);if(typeof o!=='object'||!o.logs)throw 0;st=Object.assign({},DEF,o);save();render()}catch(_){$('#impmsg').textContent='Texte non reconnu : colle une sauvegarde complète.'}break}
 case'wipe':if(t.dataset.arm){st=Object.assign({},DEF);save();render()}else{t.dataset.arm=1;t.textContent='Confirmer : tout effacer'}break}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.ev){if(t.value)st.eventDates[t.dataset.ev]=t.value;else delete st.eventDates[t.dataset.ev];save();render()}
 else if(t.id==='met'){metric=t.value;render()}else if(t.id==='df'){df=t.value;render()}});
document.addEventListener('submit',e=>{if(e.target.id!=='ci')return;e.preventDefault();const g=new FormData(e.target);
 st.thr=+g.get('thr')||7;st.checkins[TODAY]={fatigue:g.get('fatigue'),soreness:g.get('soreness'),effort:g.get('effort'),symptoms:g.getAll('sym')};save();render()});
render();
</script>
</body>
